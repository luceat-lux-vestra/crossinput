name: Research free Intel Swift CodeQL extraction speed

# Non-production experiment on a separate research branch only.
# No PR trigger or code scanning upload. Canonical PR #231 gate is untouched.
on:
  push:
    branches:
      - research/231-free-intel-swift-codeql

permissions:
  contents: read
  actions: read

concurrency:
  group: research-intel-swift-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-full-codeql-intel:
    name: Full Swift CodeQL / macOS 26 Intel standard
    runs-on: macos-26-intel
    timeout-minutes: 30
    steps:
      - name: Checkout trusted research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify identical product source and free Intel runner
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Research branch / product provenance ==='
          git rev-parse HEAD
          changed="$(git diff --name-only d7b12edda07448db72aef4d40d432a1358a704e9 HEAD)"
          printf 'Changed from production PR HEAD: %s\n' "$changed"
          test "$changed" = '.github/workflows/research-swift-codeql-intel.yml'
          echo "Unchanged product manifest blob: $(git rev-parse HEAD:apps/macos/Package.swift)"
          test "$(uname -m)" = x86_64
          sw_vers
          /usr/bin/swift --version

      - name: Initialize full Swift CodeQL with fixed CLI 2.27.2
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: autobuild
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-osx64.tar.zst

      - name: Start non-sensitive Swift process sampling
        shell: bash
        run: |
          set -euo pipefail
          ps -axo pid=,ppid=,pcpu=,comm= >/dev/null
          rm -f "$RUNNER_TEMP/swift-codeql-probe.tsv" "$RUNNER_TEMP/swift-codeql-probe.stop"
          RUNNER_TRACKING_ID='' nohup python3 scripts/swift-codeql-process-probe.py \
            sample "$RUNNER_TEMP/swift-codeql-probe.tsv" \
            "$RUNNER_TEMP/swift-codeql-probe.stop" </dev/null >/dev/null 2>&1 &

      - name: Full package Swift Autobuild under CodeQL extraction
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Summarize process probe without arguments or secrets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/swift-codeql-process-probe.py \
            report "$RUNNER_TEMP/swift-codeql-probe.tsv" \
            "$RUNNER_TEMP/swift-codeql-probe.stop"

      - name: Full CodeQL analysis without duplicate security upload
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /research:swift-intel-standard
          upload: never
