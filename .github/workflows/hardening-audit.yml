name: Hardening audit

# Weekly drift detection for controls that live outside the diff: ruleset and
# required-check drift, action pinning, workflow permissions and trust
# boundaries, and CodeQL authority. Detection is read-only; only the reporting
# job may write, and it only ever touches one owned issue.
#
# This workflow deliberately says nothing about ADR-0012 physical-device
# evidence acceptance. It checks that the analyzer/verifier tooling is present
# and unbroken; it never produces, credits, or substitutes for a device cycle.

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: detect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Static and live hardening audit
        id: audit
        env:
          # The ordinary token continuously verifies only controls it can read
          # authoritatively. Known administration-only surfaces are explicitly
          # classified as MANUAL_UNVERIFIED in hardening-policy.json; unexpected
          # readback loss remains fatal. A scoped admin-read credential may turn
          # those manual controls into real live evidence without changing policy.
          GH_TOKEN: ${{ secrets.HARDENING_AUDIT_TOKEN || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail
          python3 scripts/check-workflow-policy.py --live \
            | tee hardening-audit.txt
        continue-on-error: true

      - name: GitHub Actions static security
        run: bash scripts/check-actions-security.sh

      - name: Issue metadata semantics
        run: node --test scripts/issue-metadata.test.cjs

      - name: Physical-evidence tooling contract
        # Integrity of the verifier only. No device evidence is generated here.
        run: |
          set -euo pipefail
          python3 scripts/test-handoff-stability-analyzer.py
          python3 scripts/test-issue62-aggregator.py

      - name: Publish audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hardening-audit
          path: hardening-audit.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail the detection job on findings
        if: steps.audit.outcome != 'success'
        run: |
          echo "hardening audit reported findings; see the job log and artifact" >&2
          exit 1

  report:
    name: report
    needs: detect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.detect.result != 'success'
        with:
          name: hardening-audit
        continue-on-error: true

      - name: Reconcile the owned drift issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- hardening-audit -->';
            const title = 'chore(repo): hardening drift detected';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const existing = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', labels: 'area/ci', per_page: 100,
            });
            const owned = existing.find(issue =>
              !issue.pull_request && issue.title === title && (issue.body || '').includes(marker));

            if (process.env.DETECT_RESULT === 'success') {
              if (owned && owned.state === 'open') {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: owned.number,
                  body: [
                    marker,
                    `Hardening audit recovered on \`${context.sha}\`.`,
                    '',
                    `Run: ${runUrl}`,
                    '',
                    'Known administration-only controls may still be reported as MANUAL_UNVERIFIED;',
                    'this recovery means the scheduled detector found no confirmed drift and no',
                    'unexpected readback failure in the controls it is authorized to verify.',
                  ].join('\n'),
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: owned.number, state: 'closed',
                });
              }
              return;
            }

            let auditReport = 'The audit report artifact was not available; see the workflow run.';
            try {
              auditReport = fs.readFileSync('hardening-audit.txt', 'utf8').trim() || auditReport;
            } catch (error) {
              if (error.code !== 'ENOENT') throw error;
            }
            const body = [
              marker,
              `Scheduled hardening audit reported drift on \`${context.sha}\`.`,
              '',
              '```',
              auditReport.slice(0, 55000),
              '```',
              '',
              `Run: ${runUrl}`,
              '',
              'This issue is maintained idempotently by `.github/workflows/hardening-audit.yml`.',
              'It reports confirmed drift or unexpected audit/readback failure only. Known',
              'administration-only MANUAL_UNVERIFIED controls remain visible in the artifact',
              'but do not by themselves create/reopen this issue.',
              'It never speaks to ADR-0012 physical-device evidence acceptance.',
            ].join('\n');

            if (!owned) {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['area/ci', 'type/task', 'priority/medium'],
              });
              return;
            }
            await github.rest.issues.update({
              ...context.repo, issue_number: owned.number, body, state: 'open',
            });
