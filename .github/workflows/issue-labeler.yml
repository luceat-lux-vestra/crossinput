name: Issue labels

on:
  issues:
    types:
      - opened
      - edited
      - reopened
  workflow_dispatch:
    inputs:
      backfill:
        description: Reconcile all open issues
        required: true
        default: false
        type: boolean
      dry_run:
        description: Report intended changes without mutating labels or issues
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: issue-labeler-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Required only for canonical label maintenance and issue-label reconciliation.
      issues: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      BACKFILL: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill || false }}
    steps:
      - name: Fetch trusted default-branch classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Classify issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { reconcileIssue } = require("./scripts/issue-metadata.cjs");
            const dryRun = process.env.DRY_RUN === "true";
            const backfill = process.env.BACKFILL === "true";
            const defaultBranchRef = `refs/heads/${context.payload.repository.default_branch}`;

            if (context.eventName === "workflow_dispatch" && !dryRun && context.ref !== defaultBranchRef) {
              core.setFailed(`Mutating backfill must run from ${defaultBranchRef}; got ${context.ref}`);
              return;
            }

            const labelDefs = [
              ["type/bug", "B60205", "A defect in existing functionality"],
              ["type/feature", "1D76DB", "A new user-facing capability"],
              ["type/task", "0E8A16", "Implementation, maintenance, test, CI, or documentation task"],
              ["type/epic", "6F42C1", "Large multi-issue work stream"],
              ["area/macos-app", "FFA36C", "macOS app implementation"],
              ["area/android-helper", "C5DEF5", "Android helper implementation"],
              ["area/protocol", "5EBEFF", "CXI protocol and fixtures"],
              ["area/ci", "0E8A16", "CI/CD and automation"],
              ["area/release", "FBCA04", "Packaging and release automation"],
              ["area/docs", "FEF2C0", "Documentation"],
              ["priority/medium", "FBCA04", "Default triage priority"],
            ];

            async function ensureLabels() {
              for (const [name, color, description] of labelDefs) {
                try {
                  const { data } = await github.rest.issues.getLabel({ ...context.repo, name });
                  if (
                    (data.description || "") !== description ||
                    (data.color || "").toLowerCase() !== color.toLowerCase()
                  ) {
                    await github.rest.issues.updateLabel({
                      ...context.repo,
                      name,
                      color,
                      description,
                    });
                  }
                } catch (error) {
                  if (error.status !== 404) throw error;
                  await github.rest.issues.createLabel({
                    ...context.repo,
                    name,
                    color,
                    description,
                  });
                }
              }
            }

            async function classify(issue) {
              if (!issue || issue.pull_request) return;
              const { data: labels } = await github.rest.issues.listLabelsOnIssue({
                ...context.repo,
                issue_number: issue.number,
                per_page: 100,
              });
              const decision = reconcileIssue({ ...issue, labels });

              core.info(
                `#${issue.number} dry_run=${dryRun} expected=${decision.expectedType || "none"} add=${decision.add.join(",") || "-"} remove=${decision.remove.join(",") || "-"} diagnostics=${decision.diagnostics.join(",") || "-"}`
              );
              for (const diagnostic of decision.diagnostics) {
                core.warning(`#${issue.number}: ${diagnostic}; no heuristic type repair applied`);
              }

              if (dryRun) return;

              for (const name of decision.remove) {
                await github.rest.issues.removeLabel({
                  ...context.repo,
                  issue_number: issue.number,
                  name,
                });
              }
              if (decision.add.length) {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: issue.number,
                  labels: decision.add,
                });
              }
            }

            if (context.eventName === "issues") {
              await ensureLabels();
              await classify(context.payload.issue);
              return;
            }

            if (context.eventName === "workflow_dispatch" && backfill) {
              if (!dryRun) await ensureLabels();
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                ...context.repo,
                state: "open",
                per_page: 100,
              });
              for (const issue of issues) await classify(issue);
              return;
            }

            core.notice("No backlog reconciliation selected; no label or issue mutation performed.");
