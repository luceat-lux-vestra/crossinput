name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read # Needed to inspect the canonical exact-SHA ci.yml workflow run.
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-app:
    name: macOS App Build + Test
    runs-on: xcode-27
    timeout-minutes: 20
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Detect documentation-only scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/pr-changed-files.json"

          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            echo "::warning::Could not establish the changed-file set; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '[.[][]] | length > 0' "$changed" >/dev/null; then
            echo "::warning::Changed-file set is empty or unreadable; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '
            [ .[][] | .filename ] as $files
            | all($files[];
                . == "README.md"
                or . == "CONTRIBUTING.md"
                or . == "AGENTS.md"
                or test("^docs/.*[.]md$")
              )
          ' "$changed" >/dev/null; then
            docs_only=true
          else
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs_only"

      - name: Documentation-only fast path
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; product runtime validation is not applicable."

      - name: Reuse exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ steps.scope.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: macOS App Build + Test
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPOSITORY" != "true" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR cannot reuse base-repository workflow evidence; Final will execute the local Fast checks."
            exit 0
          fi
          base_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/ci.yml?ref=$BASE_SHA" --jq '.sha')"
          head_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/ci.yml?ref=$EXPECTED_SHA" --jq '.sha')"
          if [ "$base_workflow_sha" != "$head_workflow_sha" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fast producer workflow changed on this PR; Final will execute the local Fast checks instead of trusting self-modified evidence."
            exit 0
          fi

          for _ in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&head_sha=$EXPECTED_SHA&per_page=100")"
            latest="$(jq -c --arg sha "$EXPECTED_SHA" --arg current "$GITHUB_RUN_ID" '
              [.workflow_runs[]
               | select(.head_sha == $sha and .event == "pull_request")
               | select((.id | tostring) != $current)]
              | if length == 0 then empty else max_by(.id) end
            ' <<<"$runs")"
            if [ -z "$latest" ]; then sleep 5; continue; fi
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [ "$status" != "completed" ]; then sleep 5; continue; fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::Canonical ci.yml workflow for exact HEAD $EXPECTED_SHA concluded '$conclusion'; refusing stale or failed evidence."
              exit 1
            fi
            run_id="$(jq -r '.id' <<<"$latest")"
            jobs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
            matching_jobs="$(jq --arg name "$EXPECTED_JOB" '[.jobs[] | select(.name == $name)] | length' <<<"$jobs")"
            if [ "$matching_jobs" != "1" ]; then
              echo "::error::Canonical run $run_id must contain exactly one '$EXPECTED_JOB' job; found $matching_jobs."
              exit 1
            fi
            job_status="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | .status' <<<"$jobs")"
            job_conclusion="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | (.conclusion // "")' <<<"$jobs")"
            if [ "$job_status" != "completed" ] || [ "$job_conclusion" != "success" ]; then
              echo "::error::Canonical '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA is status=$job_status conclusion=$job_conclusion."
              exit 1
            fi
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing canonical successful '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA."
            exit 0
          done
          echo "::error::Timed out waiting for canonical exact-SHA '$EXPECTED_JOB' evidence at $EXPECTED_SHA."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
      - name: Swift Build
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: |
          cd apps/macos
          swift build

      - name: Swift Test
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        run: |
          cd apps/macos
          swift test

      - name: Package release app
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: bash scripts/package-macos.sh release

      - name: Packaged app launch smoke
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: bash scripts/smoke-packaged-app-launch.sh dist/Ampersand.app

      - name: Archive packaged app for compatibility smoke
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: tar -C dist -czf "$RUNNER_TEMP/Ampersand.app.tgz" Ampersand.app

      - name: Upload packaged app for compatibility smoke
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ampersand-macos27-candidate
          path: ${{ runner.temp }}/Ampersand.app.tgz
          if-no-files-found: error
          retention-days: 1

  macos-15-compat:
    name: macOS 15 Packaged App Compatibility
    needs: [macos-app]
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Documentation-only fast path
        if: ${{ needs.macos-app.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; packaged app compatibility is not applicable."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.macos-app.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false

      - name: Download macOS 27 packaged candidate
        if: ${{ needs.macos-app.outputs.docs_only != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ampersand-macos27-candidate
          path: "${{ runner.temp }}/ampersand-compat"

      - name: Extract packaged candidate
        if: ${{ needs.macos-app.outputs.docs_only != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ampersand-compat/app"
          tar -xzf "$RUNNER_TEMP/ampersand-compat/Ampersand.app.tgz" \
            -C "$RUNNER_TEMP/ampersand-compat/app"

      - name: Launch Xcode 27 packaged app on macOS 15
        if: ${{ needs.macos-app.outputs.docs_only != 'true' }}
        run: |
          bash scripts/smoke-packaged-app-launch.sh \
            "$RUNNER_TEMP/ampersand-compat/app/Ampersand.app"

  android-helper:
    name: Android Helper Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Detect documentation-only scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/pr-changed-files.json"

          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            echo "::warning::Could not establish the changed-file set; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '[.[][]] | length > 0' "$changed" >/dev/null; then
            echo "::warning::Changed-file set is empty or unreadable; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '
            [ .[][] | .filename ] as $files
            | all($files[];
                . == "README.md"
                or . == "CONTRIBUTING.md"
                or . == "AGENTS.md"
                or test("^docs/.*[.]md$")
              )
          ' "$changed" >/dev/null; then
            docs_only=true
          else
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs_only"

      - name: Documentation-only fast path
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; product runtime validation is not applicable."

      - name: Reuse exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ steps.scope.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: Android Helper Build + Test
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
