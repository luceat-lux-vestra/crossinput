name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-app:
    name: macOS App Build + Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift Test
        run: |
          cd apps/macos
          swift build
          swift test

  android-helper:
    name: Android Helper Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Gradle Test
        run: |
          cd android/helper
          chmod +x gradlew
          ./gradlew test assembleDebug --console=plain

  markdown:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - name: Protocol Document Fixture Validation
        run: |
          node protocol/scripts/check-fixtures.mjs
