            fi
            job_status="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | .status' <<<"$jobs")"
            job_conclusion="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | (.conclusion // "")' <<<"$jobs")"
            if [ "$job_status" != "completed" ] || [ "$job_conclusion" != "success" ]; then
              echo "::error::Canonical '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA is status=$job_status conclusion=$job_conclusion."
              exit 1
            fi
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing canonical successful '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA."
            exit 0
          done
          echo "::error::Timed out waiting for canonical exact-SHA '$EXPECTED_JOB' evidence at $EXPECTED_SHA."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        with:
          persist-credentials: false
      - name: "Repository hardening policy (workflows vs .github/hardening-policy.json)"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        # Static, offline half of the drift audit: required-context producers,
        # action pinning, least privilege, and trust boundaries. Kept in an
        # always-present required job so a new workflow-security context cannot
        # itself become an optional, silently-skipped check.
        run: python3 scripts/check-workflow-policy.py
      - name: "Repository hardening policy fixtures"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: python3 scripts/test-workflow-policy.py
      - name: "Issue metadata semantics"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: node --test scripts/issue-metadata.test.cjs
      - name: "GitHub Actions static security"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: bash scripts/check-actions-security.sh
      # The on-device drivers are not exercised by any other job; an unbalanced
      # brace here only surfaces at verification time on a real device.
      - name: "bash -n"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: "Semantic input boundary guard"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: python3 scripts/check-input-boundaries.py
      - name: "Issue62 aggregation fixture"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        # Runs the embedded python aggregator from verify-device-issue62.sh
        # against synthetic raw evidence so a NameError/regression in the
        # summary pipeline fails CI instead of surfacing only on a device.
        run: python3 scripts/test-issue62-aggregator.py
      - name: "Issue62 rc-path fixture"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        # The driver must survive a missing result JSON (cxi-stress exit 3
        # writes no JSON) and take the PRECONDITION path instead.
        run: bash scripts/test-issue62-rc-path.sh
      - name: "Evidence sanitizer regression"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: bash scripts/test-verify-device-evidence-sanitizer.sh
      - name: "ADR-0012 stability analyzer fixtures"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        # The Level-3 gate computation must not regress: every gate state
        # (PASS / INCOMPLETE / HOLD / FAIL), cycle-credit rules, identity
        # validation, and fail-closed behavior are pinned here.
        run: python3 scripts/test-handoff-stability-analyzer.py

  dependencyReview:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  mergeGate:
    name: Merge Gate
    needs: [macos-app, macos-15-compat, android-helper, markdown, scripts, dependencyReview]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every merge-gate component to succeed
        env:
          MACOS_RESULT: ${{ needs['macos-app'].result }}
          MACOS_COMPAT_RESULT: ${{ needs['macos-15-compat'].result }}
          ANDROID_RESULT: ${{ needs['android-helper'].result }}
          DOCS_RESULT: ${{ needs.markdown.result }}
          TOOLING_RESULT: ${{ needs.scripts.result }}
          DEPENDENCY_RESULT: ${{ needs.dependencyReview.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for entry in \
            "macOS App Build + Test=$MACOS_RESULT" \
            "macOS 15 Packaged App Compatibility=$MACOS_COMPAT_RESULT" \
            "Android Helper Build + Test=$ANDROID_RESULT" \
            "Documentation Validation=$DOCS_RESULT" \
            "Evidence & Tooling Validation=$TOOLING_RESULT" \
            "Dependency Review=$DEPENDENCY_RESULT"
          do
            name="${entry%%=*}"
            result="${entry#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::$name concluded '$result'; Merge Gate remains closed."
              failed=1
            fi
          done
          exit "$failed"

