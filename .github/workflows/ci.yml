name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  actions: read # Needed to inspect the canonical exact-SHA ci.yml workflow run.
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos-app:
    name: macOS App Build + Test
    runs-on: xcode-27
    timeout-minutes: 20
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      reused_compat: ${{ steps.fast-evidence.outputs.reuse }}
    steps:
      - name: Detect documentation-only scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/pr-changed-files.json"

          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            echo "::warning::Could not establish the changed-file set; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '[.[][]] | length > 0' "$changed" >/dev/null; then
            echo "::warning::Changed-file set is empty or unreadable; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '
            [ .[][] | .filename ] as $files
            | all($files[];
                . == "README.md"
                or . == "CONTRIBUTING.md"
                or . == "AGENTS.md"
                or test("^docs/.*[.]md$")
              )
          ' "$changed" >/dev/null; then
            docs_only=true
          else
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs_only"

      - name: Documentation-only fast path
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; product runtime validation is not applicable."

      - name: Reuse exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ steps.scope.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: macOS App Build + Test
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          resolver="$RUNNER_TEMP/resolve-fast-evidence.py"
          if ! gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/resolve-fast-evidence.py?ref=$BASE_SHA" \
            > "$resolver"; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Trusted base Fast-evidence resolver is unavailable; Final will execute the local Fast checks."
            exit 0
          fi
          python3 "$resolver"
          # The macOS 15 consumer must have passed in the SAME trusted exact-SHA
          # producer run before we suppress its macOS 27 packaged artifact.
          if grep -qx 'reuse=true' "$GITHUB_OUTPUT"; then
            compat_output="$(mktemp)"
            EXPECTED_JOB="macOS 15 Packaged App Compatibility" GITHUB_OUTPUT="$compat_output" python3 "$resolver"
            cat "$compat_output" >> "$GITHUB_OUTPUT"
            rm -f "$compat_output"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
      - name: Swift Build
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: |
          cd apps/macos
          swift build

      - name: Swift Test
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        run: |
          cd apps/macos
          swift test

      - name: Package release app
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: bash scripts/package-macos.sh release

      - name: Packaged app launch smoke
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: bash scripts/smoke-packaged-app-launch.sh dist/Ampersand.app

      - name: Archive packaged app for compatibility smoke
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: tar -C dist -czf "$RUNNER_TEMP/Ampersand.app.tgz" Ampersand.app

      - name: Upload packaged app for compatibility smoke
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ampersand-macos27-candidate
          path: ${{ runner.temp }}/Ampersand.app.tgz
          if-no-files-found: error
          retention-days: 1

  macos-15-compat:
    name: macOS 15 Packaged App Compatibility
    needs: [macos-app]
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Reuse proven exact-SHA packaged compatibility
        if: ${{ needs.macos-app.outputs.reused_compat == 'true' }}
        run: echo "Exact-SHA macOS 27 and macOS 15 evidence both verified; no duplicate packaged smoke."

      - name: Documentation-only fast path
        if: ${{ needs.macos-app.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; packaged app compatibility is not applicable."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.macos-app.outputs.docs_only != 'true' && needs.macos-app.outputs.reused_compat != 'true' }}
        with:
          persist-credentials: false

      - name: Download macOS 27 packaged candidate
        if: ${{ needs.macos-app.outputs.docs_only != 'true' && needs.macos-app.outputs.reused_compat != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ampersand-macos27-candidate
          path: "${{ runner.temp }}/ampersand-compat"

      - name: Extract packaged candidate
        if: ${{ needs.macos-app.outputs.docs_only != 'true' && needs.macos-app.outputs.reused_compat != 'true' }}
        run: |
          mkdir -p "$RUNNER_TEMP/ampersand-compat/app"
          tar -xzf "$RUNNER_TEMP/ampersand-compat/Ampersand.app.tgz" \
            -C "$RUNNER_TEMP/ampersand-compat/app"

      - name: Launch Xcode 27 packaged app on macOS 15
        if: ${{ needs.macos-app.outputs.docs_only != 'true' && needs.macos-app.outputs.reused_compat != 'true' }}
        run: |
          bash scripts/smoke-packaged-app-launch.sh \
            "$RUNNER_TEMP/ampersand-compat/app/Ampersand.app"

  android-helper:
    name: Android Helper Build + Test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Detect documentation-only scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/pr-changed-files.json"

          if ! gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$changed"; then
            echo "::warning::Could not establish the changed-file set; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! jq -e '[.[][]] | length > 0' "$changed" >/dev/null; then
            echo "::warning::Changed-file set is empty or unreadable; using full validation."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e '
            [ .[][] | .filename ] as $files
            | all($files[];
                . == "README.md"
                or . == "CONTRIBUTING.md"
                or . == "AGENTS.md"
                or test("^docs/.*[.]md$")
              )
          ' "$changed" >/dev/null; then
            docs_only=true
          else
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs-only=$docs_only"

      - name: Documentation-only fast path
        if: ${{ steps.scope.outputs.docs_only == 'true' }}
        run: echo "Documentation-only change; product runtime validation is not applicable."

      - name: Reuse exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ steps.scope.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: Android Helper Build + Test
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          resolver="$RUNNER_TEMP/resolve-fast-evidence.py"
          if ! gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/resolve-fast-evidence.py?ref=$BASE_SHA" \
            > "$resolver"; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Trusted base Fast-evidence resolver is unavailable; Final will execute the local Fast checks."
            exit 0
          fi
          python3 "$resolver"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          distribution: temurin
          java-version: '25.0.4'
          cache: gradle
          cache-jdk: true
          # Only trusted main seed/scheduled CodeQL writes cache entries.
          # PR-controlled workflow never publishes executable cache state.
          cache-read-only: true
          cache-dependency-path: |
            android/helper/**/*.gradle*
            android/helper/**/gradle.properties
            android/helper/**/gradle-wrapper.properties
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
      - name: Install Android 17 SDK
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: |
          command -v sdkmanager >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"
      - name: Install native ARM64 Android 37 build tools
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: bash scripts/setup-android-arm64-build-tools.sh
      - name: Validate Gradle wrapper
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: "Static guard: no input payload in logs"
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        # Fails closed: missing scanner or undetected planted violation breaks
        # the job (the previous inline `rg` call false-greened without ripgrep).
        run: scripts/check-log-guard.sh
      - name: Gradle Build
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: |
          cd android/helper
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Gradle Test
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        run: |
          cd android/helper
          chmod +x gradlew
          ./gradlew test --console=plain
      - name: Verify Java 25 / Android 17 toolchain
        if: ${{ steps.scope.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: scripts/check-android-toolchain.sh

  markdown:
    name: Documentation Validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Reuse exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: Documentation Validation
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          resolver="$RUNNER_TEMP/resolve-fast-evidence.py"
          if ! gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/resolve-fast-evidence.py?ref=$BASE_SHA" \
            > "$resolver"; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Trusted base Fast-evidence resolver is unavailable; Final will execute the local Fast checks."
            exit 0
          fi
          python3 "$resolver"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        with:
          node-version: "26.9.0"
      - name: Protocol Document Fixture Validation
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: |
          node protocol/scripts/check-fixtures.mjs

  scripts:
    name: Evidence & Tooling Validation
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Reuse exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: Evidence & Tooling Validation
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          resolver="$RUNNER_TEMP/resolve-fast-evidence.py"
          if ! gh api \
            -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/scripts/resolve-fast-evidence.py?ref=$BASE_SHA" \
            > "$resolver"; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Trusted base Fast-evidence resolver is unavailable; Final will execute the local Fast checks."
            exit 0
          fi
          python3 "$resolver"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        with:
          persist-credentials: false
      - name: "Repository hardening policy (workflows vs .github/hardening-policy.json)"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        # Static, offline half of the drift audit: required-context producers,
        # action pinning, least privilege, and trust boundaries. Kept in an
        # always-present required job so a new workflow-security context cannot
        # itself become an optional, silently-skipped check.
        run: python3 scripts/check-workflow-policy.py
      - name: "Repository hardening policy fixtures"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: python3 scripts/test-workflow-policy.py
      - name: "Fast evidence resolver fixtures"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: python3 scripts/test-fast-evidence.py
      - name: "Release CodeQL SARIF negative controls"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: python3 scripts/release_codeql_verdict.py --self-test
      - name: "Release CodeQL run identity negative controls"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: python3 scripts/release_codeql_gate.py --self-test

      - name: "Issue metadata semantics"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: node --test scripts/issue-metadata.test.cjs
      - name: "GitHub Actions static security"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: bash scripts/check-actions-security.sh
      # The on-device drivers are not exercised by any other job; an unbalanced
      # brace here only surfaces at verification time on a real device.
      - name: "bash -n"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: "Semantic input boundary guard"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: python3 scripts/check-input-boundaries.py
      - name: "Issue62 aggregation fixture"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        # Runs the embedded python aggregator from verify-device-issue62.sh
        # against synthetic raw evidence so a NameError/regression in the
        # summary pipeline fails CI instead of surfacing only on a device.
        run: python3 scripts/test-issue62-aggregator.py
      - name: "Issue62 rc-path fixture"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        # The driver must survive a missing result JSON (cxi-stress exit 3
        # writes no JSON) and take the PRECONDITION path instead.
        run: bash scripts/test-issue62-rc-path.sh
      - name: "Evidence sanitizer regression"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        run: bash scripts/test-verify-device-evidence-sanitizer.sh
      - name: "ADR-0012 stability analyzer fixtures"
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true' }}
        # The Level-3 gate computation must not regress: every gate state
        # (PASS / INCOMPLETE / HOLD / FAIL), cycle-credit rules, identity
        # validation, and fail-closed behavior are pinned here.
        run: python3 scripts/test-handoff-stability-analyzer.py

  dependencyReview:
    name: Dependency Review
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  mergeGate:
    name: Merge Gate
    needs: [macos-app, macos-15-compat, android-helper, markdown, scripts, dependencyReview]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every merge-gate component to succeed
        env:
          MACOS_RESULT: ${{ needs['macos-app'].result }}
          MACOS_COMPAT_RESULT: ${{ needs['macos-15-compat'].result }}
          ANDROID_RESULT: ${{ needs['android-helper'].result }}
          DOCS_RESULT: ${{ needs.markdown.result }}
          TOOLING_RESULT: ${{ needs.scripts.result }}
          DEPENDENCY_RESULT: ${{ needs.dependencyReview.result }}
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for entry in \
            "macOS App Build + Test=$MACOS_RESULT" \
            "macOS 15 Packaged App Compatibility=$MACOS_COMPAT_RESULT" \
            "Android Helper Build + Test=$ANDROID_RESULT" \
            "Documentation Validation=$DOCS_RESULT" \
            "Evidence & Tooling Validation=$TOOLING_RESULT" \
            "Dependency Review=$DEPENDENCY_RESULT"
          do
            name="${entry%%=*}"
            result="${entry#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::$name concluded '$result'; Merge Gate remains closed."
              failed=1
            fi
          done
          exit "$failed"

