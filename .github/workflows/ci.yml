name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-app:
    name: macOS App Build + Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Swift Test
        run: |
          cd apps/macos
          swift build
          swift test

  android-helper:
    name: Android Helper Build + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: "Static guard: no input payload in logs"
        # Fails closed: missing scanner or undetected planted violation breaks
        # the job (the previous inline `rg` call false-greened without ripgrep).
        run: scripts/check-log-guard.sh
      - name: Gradle Test
        run: |
          cd android/helper
          chmod +x gradlew
          ./gradlew test assembleDebug --console=plain

  markdown:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Protocol Document Fixture Validation
        run: |
          node protocol/scripts/check-fixtures.mjs

  scripts:
    name: Shell Script Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The on-device drivers are not exercised by any other job; an unbalanced
      # brace here only surfaces at verification time on a real device.
      - name: "bash -n"
        run: |
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: "Issue62 aggregation fixture"
        # Runs the embedded python aggregator from verify-device-issue62.sh
        # against synthetic raw evidence so a NameError/regression in the
        # summary pipeline fails CI instead of surfacing only on a device.
        run: python3 scripts/test-issue62-aggregator.py
      - name: "Issue62 rc-path fixture"
        # The driver must survive a missing result JSON (cxi-stress exit 3
        # writes no JSON) and take the PRECONDITION path instead.
        run: bash scripts/test-issue62-rc-path.sh
      - name: "Evidence sanitizer regression"
        run: bash scripts/test-verify-device-evidence-sanitizer.sh
