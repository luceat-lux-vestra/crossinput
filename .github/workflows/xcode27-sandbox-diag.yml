name: macOS sandbox executable architecture diagnostic

# Research-only diagnostic; NEVER a replacement for CodeQL or Merge Gate.
# No credentials/secrets. The synthetic CodeQL study checks out trusted-repo PRs\n# only; untrusted fork PRs cannot execute that job. Product scanning is unchanged.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/xcode27-sandbox-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-arch-diag-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-binary-architecture:
    name: Sandbox executable on ${{ matrix.image }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.image }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        image:
          - macos-15
          - macos-26
          - xcode-27
    steps:
      - name: Identify native OS architecture and toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Architecture and operating system ==="
          uname -m
          sw_vers
          echo "=== Swift toolchain ==="
          /usr/bin/swift --version
          echo "=== sandbox-exec file metadata ==="
          if test -e /usr/bin/sandbox-exec; then
            /usr/bin/file /usr/bin/sandbox-exec
            /usr/bin/lipo -archs /usr/bin/sandbox-exec || true
            /usr/bin/otool -hv /usr/bin/sandbox-exec || true
          else
            echo "SANDBOX_EXEC_NOT_PRESENT"
          fi
          echo "=== Selected binary types ==="
          /usr/bin/file /usr/bin/swift /usr/bin/true

      - name: Exercise system sandbox-exec with a harmless command
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64" || {
            echo "RUNNER_ARCH_MISMATCH"
            exit 1
          }
          echo "=== Unsandboxed native command ==="
          /usr/bin/true
          echo "=== Sandboxed native true command ==="
          set +e
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true \
            > "$RUNNER_TEMP/sandbox.stdout" 2> "$RUNNER_TEMP/sandbox.stderr"
          rc=$?
          set -e
          echo "sandbox_exec_exit_status=$rc"
          echo "sandbox_exec_stderr:"
          cat "$RUNNER_TEMP/sandbox.stderr"
          if [ "$rc" -eq 0 ]; then
            echo "SANDBOX_EXEC_COMPATIBLE"
          else
            echo "SANDBOX_EXEC_INCOMPATIBLE_NOT_A_VALID_CODEQL_RESULT"
          fi
          {
            echo "### Sandbox executable diagnostic"
            echo "- Runner: ${{ matrix.image }}"
            echo "- Native architecture: $(uname -m)"
            echo "- sandbox-exec exit: $rc"
            echo "- This diagnostic does not run, disable or replace CodeQL."
          } >> "$GITHUB_STEP_SUMMARY"

  codeql-swiftpm-sandbox-isolation:
    name: CodeQL SwiftPM sandbox ${{ matrix.variant }} on xcode-27
    # Study only trusted-repository PRs, never fork-provided manifests/scripts.
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: xcode-27
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default-sandbox
            sandbox_mode: default
          - variant: disabled-sandbox-diagnostic-only
            sandbox_mode: disable
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create deterministic synthetic Swift package (not user project)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .codeql-sandbox-probe/Sources/CodeQLSandboxProbe
          printf '%s\n' \
            '// swift-tools-version:6.0' \
            'import PackageDescription' \
            'let package = Package(name: "CodeQLSandboxProbe", targets: [.executableTarget(name: "CodeQLSandboxProbe")])' \
            > .codeql-sandbox-probe/Package.swift
          printf '%s\n' 'print("CodeQL diagnostic synthetic source")' \
            > .codeql-sandbox-probe/Sources/CodeQLSandboxProbe/main.swift
          echo "Runner architecture: $(uname -m)"
          /usr/bin/swift --version

      - name: Initialize Swift CodeQL tracer in manual mode (research only)
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual

      - name: Compile deterministic Swift package under CodeQL instrumentation
        shell: bash
        env:
          SANDBOX_MODE: ${{ matrix.sandbox_mode }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          echo "Research variant: $SANDBOX_MODE"
          if [ "$SANDBOX_MODE" = disable ]; then
            # Diagnose SwiftPM sandbox spawning ONLY for synthetic fixed code.
            # Never copy this flag into production Swift CodeQL or fork PR builds.
            /usr/bin/swift build --package-path .codeql-sandbox-probe --arch arm64 --disable-sandbox
          else
            /usr/bin/swift build --package-path .codeql-sandbox-probe --arch arm64
          fi

      - name: Analyze synthetic CodeQL database without security-alert upload
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          upload: never
          category: /research:swiftpm-${{ matrix.variant }}
