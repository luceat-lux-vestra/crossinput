name: macOS sandbox executable architecture diagnostic

# Research-only diagnostic; NEVER a replacement for CodeQL or Merge Gate.
# No credentials/secrets. The synthetic CodeQL study checks out trusted-repo PRs\n# only; untrusted fork PRs cannot execute that job. Product scanning is unchanged.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/xcode27-sandbox-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandbox-arch-diag-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-binary-architecture:
    name: Sandbox executable on ${{ matrix.image }}
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ${{ matrix.image }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        image:
          - macos-15
          - macos-26
          - xcode-27
    steps:
      - name: Identify native OS architecture and toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Architecture and operating system ==="
          uname -m
          sw_vers
          echo "=== Swift toolchain ==="
          /usr/bin/swift --version
          echo "=== sandbox-exec file metadata ==="
          if test -e /usr/bin/sandbox-exec; then
            /usr/bin/file /usr/bin/sandbox-exec
            /usr/bin/lipo -archs /usr/bin/sandbox-exec || true
            /usr/bin/otool -hv /usr/bin/sandbox-exec || true
          else
            echo "SANDBOX_EXEC_NOT_PRESENT"
          fi
          echo "=== Selected binary types ==="
          /usr/bin/file /usr/bin/swift /usr/bin/true

      - name: Exercise system sandbox-exec with a harmless command
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64" || {
            echo "RUNNER_ARCH_MISMATCH"
            exit 1
          }
          echo "=== Unsandboxed native command ==="
          /usr/bin/true
          echo "=== Sandboxed native true command ==="
          set +e
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true \
            > "$RUNNER_TEMP/sandbox.stdout" 2> "$RUNNER_TEMP/sandbox.stderr"
          rc=$?
          set -e
          echo "sandbox_exec_exit_status=$rc"
          echo "sandbox_exec_stderr:"
          cat "$RUNNER_TEMP/sandbox.stderr"
          if [ "$rc" -eq 0 ]; then
            echo "SANDBOX_EXEC_COMPATIBLE"
          else
            echo "SANDBOX_EXEC_INCOMPATIBLE_NOT_A_VALID_CODEQL_RESULT"
          fi
          {
            echo "### Sandbox executable diagnostic"
            echo "- Runner: ${{ matrix.image }}"
            echo "- Native architecture: $(uname -m)"
            echo "- sandbox-exec exit: $rc"
            echo "- This diagnostic does not run, disable or replace CodeQL."
          } >> "$GITHUB_STEP_SUMMARY"

  codeql-dyld-loader-isolation:
    name: CodeQL injected loader on ${{ matrix.image }}
    # Research only: CodeQL tracing and system tools, never a production scan.
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ matrix.image }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - macos-26
          - xcode-27
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize Swift CodeQL instrumentation for native loader audit
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual

      - name: Inspect actual CodeQL tracer Mach-O slices with preload disabled
        shell: bash
        env:
          # Required just to start the diagnostic shell on candidate macOS27;
          # the next probes explicitly re-enable it on harmless system tools.
          DYLD_INSERT_LIBRARIES: ""
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          echo "=== Native runner and CodeQL distribution ==="
          sw_vers
          echo "CodeQL version:"
          "$CODEQL_DIST/codeql" version
          tracer="$CODEQL_DIST/tools/osx64/libtrace.dylib"
          echo "=== CodeQL tracer binary architecture ==="
          test -f "$tracer"
          /usr/bin/file "$tracer"
          /usr/bin/lipo -archs "$tracer"
          echo "=== Native baseline shell ==="
          /bin/bash -c 'echo NATIVE_BASH_STARTED'
          echo "=== CodeQL tracer injected into shell ==="
          set +e
          DYLD_INSERT_LIBRARIES="$tracer" /bin/bash -c 'echo TRACED_BASH_STARTED'
          traced_shell_rc=$?
          echo "=== CodeQL tracer injected into native sandbox executable ==="
          DYLD_INSERT_LIBRARIES="$tracer" /usr/bin/sandbox-exec \
            -p '(version 1)(allow default)' /usr/bin/true
          traced_sandbox_rc=$?
          set -e
          echo "CODEQL_TRACED_BASH_EXIT=$traced_shell_rc"
          echo "CODEQL_TRACED_SANDBOX_EXIT=$traced_sandbox_rc"
          echo "These synthetic system-executable tests are not a Swift CodeQL scan."
          {
            echo "### Native CodeQL dylib-loader compatibility"
            echo "- Runner: ${{ matrix.image }}"
            echo "- Native arch: $(uname -m)"
            echo "- Traced bash return code: $traced_shell_rc"
            echo "- Traced sandbox-exec return code: $traced_sandbox_rc"
            echo "- Observational only; keep production Swift CodeQL untouched."
          } >> "$GITHUB_STEP_SUMMARY"
