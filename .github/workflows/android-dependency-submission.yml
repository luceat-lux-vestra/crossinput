name: Android Dependency Submission

on:
  push:
    branches: [main]
    paths:
      - "android/helper/**/*.gradle*"
      - "android/helper/**/gradle.properties"
      - "android/helper/**/gradle-wrapper.properties"
      - "android/helper/gradle/**"
      - ".github/workflows/android-dependency-submission.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit Android Gradle Dependency Graph
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25.0.4"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Generate and submit Android Gradle dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          build-root-directory: android/helper
          dependency-graph: generate-and-submit
          cache-read-only: true
          validate-wrappers: true
