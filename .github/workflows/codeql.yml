name: CodeQL
run-name: CodeQL source ${{ inputs.candidate_sha || github.sha }}

# Full CodeQL runs only on weekly schedule or exact-main manual dispatch.
# PR scan trigger intentionally removed after protected-main validation #38524071347.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character protected main SHA to scan"
        required: true
        type: string
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  scan-guard:
    name: CodeQL schedule guard
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_scan: ${{ steps.decide.outputs.should_scan }}
    steps:
      - name: Decide whether full CodeQL is required
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != schedule ]]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/runs?event=schedule&status=success&branch=main&per_page=100")"
          if jq -e --arg sha "$GITHUB_SHA" --argjson current "$GITHUB_RUN_ID" '
            .workflow_runs | any(.id != $current and .head_sha == $sha
              and .head_branch == "main" and .path == ".github/workflows/codeql.yml")
          ' <<<"$runs" >/dev/null; then
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            echo "Unchanged scheduled main SHA: skip expensive CodeQL matrix"
          else
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    needs: scan-guard
    if: needs.scan-guard.outputs.should_scan == 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-24.04-arm
          - language: java-kotlin
            build-mode: manual
            os: ubuntu-24.04-arm
          - language: python
            build-mode: none
            os: ubuntu-24.04-arm
          - language: swift
            build-mode: autobuild
            os: macos-15

    steps:
      - name: Require exact protected-main source for full CodeQL evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Exact 40-character SHA required"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Trusted main workflow only"; exit 1; }
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            [[ "$GITHUB_SHA" == "$EXPECTED_SHA" ]] || exit 1
          else
            [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] || exit 1
          fi
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${remote_main}")"
          jq -e --arg sha "$EXPECTED_SHA" '
            (.status == "ahead" or .status == "identical")
            and .base_commit.sha == $sha and .merge_base_commit.sha == $sha
          ' <<<"$compare" >/dev/null || { echo "::error::Not a protected-main ancestor"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Only the immutable candidate tree is required; protected-main
          # ancestry is independently verified with the GitHub Compare API.
          fetch-depth: 1
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify scanned source checkout and ancestry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || exit 1
          # Repeat the authenticated main-ancestry check after checkout. Unlike
          # local merge-base, this also proves older protected-main candidates
          # without fetching the whole repository history.
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${remote_main}")"
          jq -e --arg sha "$EXPECTED_SHA" '
            (.status == "ahead" or .status == "identical")
            and .base_commit.sha == $sha and .merge_base_commit.sha == $sha
          ' <<<"$compare" >/dev/null || {
            echo "::error::Checked-out source is not a protected-main ancestor"; exit 1;
          }

      - name: Record exact source identity
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          expected = os.environ["EXPECTED_SHA"]
          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if actual != expected:
              raise SystemExit("Wrong checkout identity")
          doc = {"schema": 1, "candidate_sha": expected, "checkout_sha": actual,
                 "event_sha": os.environ["GITHUB_SHA"], "run_id": int(os.environ["GITHUB_RUN_ID"]),
                 "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                 "language": os.environ["CODEQL_LANGUAGE"]}
          pathlib.Path(os.environ["RUNNER_TEMP"], "source-identity.json").write_text(json.dumps(doc))
          PY

      - name: Retain source identity manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-codeql-source-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ runner.temp }}/source-identity.json
          if-no-files-found: error
          retention-days: 90

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25.0.4'
          cache: gradle
          cache-jdk: true
          cache-read-only: ${{ github.event_name != 'schedule' }}
          cache-dependency-path: |
            android/helper/**/*.gradle*
            android/helper/**/gradle.properties
            android/helper/**/gradle-wrapper.properties

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android 17 SDK
        if: matrix.language == 'java-kotlin'
        run: |
          command -v sdkmanager >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install native ARM64 Android 37 build tools
        if: matrix.language == 'java-kotlin'
        run: bash scripts/setup-android-arm64-build-tools.sh

      - name: Validate Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build Android helper for CodeQL
        if: matrix.language == 'java-kotlin'
        run: |
          cd android/helper
          chmod +x gradlew
          ./gradlew test assembleDebug --console=plain

      - name: Verify Java 25 / Android 17 toolchain
        if: matrix.language == 'java-kotlin'
        run: scripts/check-android-toolchain.sh

      - name: Autobuild Swift sources for CodeQL
        if: matrix.language == 'swift'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event_name == 'workflow_dispatch' && 'never' || 'always' }}
          output: ${{ runner.temp }}/release-codeql-${{ matrix.language }}

      - name: Retain exact-main raw CodeQL SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-codeql-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 90

      - name: Reject invalid or High/Critical exact-main SARIF
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          python3 scripts/release_codeql_verdict.py \
            --sarif-dir "$SARIF_DIR" \
            --language "${{ matrix.language }}" \
            --candidate-sha "$EXPECTED_SHA"
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${remote_main}")"
          jq -e --arg sha "$EXPECTED_SHA" '(.status == "ahead" or .status == "identical") and .merge_base_commit.sha == $sha and .base_commit.sha == $sha' <<<"$compare" >/dev/null || exit 1
