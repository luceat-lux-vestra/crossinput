name: CodeQL

# Full CodeQL runs only on weekly schedule or exact-main manual dispatch.
# PR scan trigger intentionally removed after protected-main validation #38524071347.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character protected main SHA to scan"
        required: true
        type: string
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            os: ubuntu-24.04-arm
          - language: java-kotlin
            build-mode: manual
            os: ubuntu-24.04-arm
          - language: python
            build-mode: none
            os: ubuntu-24.04-arm
          - language: swift
            build-mode: autobuild
            os: macos-15

    steps:
      - name: Require exact protected-main source for full CodeQL evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Exact 40-character SHA required"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_SHA" == "$EXPECTED_SHA" ]] || {
            echo "::error::Manual/weekly CodeQL must target exact protected main event SHA"; exit 1;
          }
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$remote_main" == "$EXPECTED_SHA" ]] || { echo "::error::main moved or differs from requested SHA"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4'
          cache: gradle
          cache-jdk: true
          cache-read-only: ${{ github.event_name != 'schedule' }}
          cache-dependency-path: |
            android/helper/**/*.gradle*
            android/helper/**/gradle.properties
            android/helper/**/gradle-wrapper.properties

      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android 17 SDK
        if: matrix.language == 'java-kotlin'
        run: |
          command -v sdkmanager >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install native ARM64 Android 37 build tools
        if: matrix.language == 'java-kotlin'
        run: bash scripts/setup-android-arm64-build-tools.sh

      - name: Validate Gradle wrapper
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build Android helper for CodeQL
        if: matrix.language == 'java-kotlin'
        run: |
          cd android/helper
          chmod +x gradlew
          ./gradlew test assembleDebug --console=plain

      - name: Verify Java 25 / Android 17 toolchain
        if: matrix.language == 'java-kotlin'
        run: scripts/check-android-toolchain.sh

      - name: Autobuild Swift sources for CodeQL
        if: matrix.language == 'swift'
        uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event_name == 'workflow_dispatch' && 'never' || 'always' }}
          output: ${{ runner.temp }}/release-codeql-${{ matrix.language }}

      - name: Retain exact-main raw CodeQL SARIF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-codeql-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 90

      - name: Reject invalid or High/Critical exact-main SARIF
        env:
          GH_TOKEN: ${{ github.token }}
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          python3 scripts/release_codeql_verdict.py \
            --sarif-dir "$SARIF_DIR" \
            --language "${{ matrix.language }}" \
            --candidate-sha "$EXPECTED_SHA"
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$remote_main" == "$EXPECTED_SHA" ]] || { echo "::error::main moved during full CodeQL"; exit 1; }
