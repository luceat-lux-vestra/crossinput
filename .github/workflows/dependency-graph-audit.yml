name: Gradle Dependency Graph Audit

on:
  pull_request:
    paths:
      - "android/helper/**/*.gradle*"
      - "android/helper/**/gradle.properties"
      - "android/helper/**/gradle-wrapper.properties"
      - "android/helper/gradle/**"
      - ".github/workflows/dependency-graph-audit.yml"

permissions:
  contents: read

jobs:
  graph:
    name: Android Gradle Graph (non-submitting)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25.0.4"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager >/dev/null
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Generate dependency graph without submission
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: android/helper
          dependency-graph: generate-and-upload
          cache-read-only: true
          artifact-retention-days: 1
