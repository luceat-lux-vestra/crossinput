name: Pull request labels

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure managed labels and classify PR type
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const managed = [
              ['type/bug', 'B60205', 'A defect in existing functionality'],
              ['type/feature', '1D76DB', 'A new user-facing capability'],
              ['type/task', '0E8A16', 'Implementation, maintenance, test, CI, or documentation task'],
              ['type/epic', '6F42C1', 'Large multi-issue work stream'],
              ['area/macos-app', 'FFA36C', 'macOS app implementation'],
              ['area/android-helper', 'C5DEF5', 'Android helper implementation'],
              ['area/protocol', '5EBEFF', 'CXI protocol and fixtures'],
              ['area/ci', '0E8A16', 'CI/CD and automation'],
              ['area/release', 'FBCA04', 'Packaging and release automation'],
              ['area/docs', 'FEF2C0', 'Documentation'],
              ['dependencies', '0366D6', 'Dependency updates'],
            ];
            for (const [name, color, description] of managed) {
              try {
                const { data } = await github.rest.issues.getLabel({ ...context.repo, name });
                if ((data.description || '') !== description) {
                  await github.rest.issues.updateLabel({ ...context.repo, name, description });
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({ ...context.repo, name, color, description });
              }
            }

            const pr = context.payload.pull_request;
            const title = pr.title.trim().toLowerCase();
            let type = null;
            if (/^(fix|bug)(\([^)]*\))?:/.test(title)) type = 'type/bug';
            else if (/^(feat|feature)(\([^)]*\))?:/.test(title)) type = 'type/feature';
            else if (/^epic(\([^)]*\))?:/.test(title)) type = 'type/epic';

            if (!type) {
              const referenceText = `${pr.title}\n${pr.body || ''}`;
              const matches = [...referenceText.matchAll(/#(\d+)/g)]
                .map(match => Number(match[1]))
                .filter(number => number !== pr.number);
              for (const issueNumber of [...new Set(matches)].slice(0, 10)) {
                try {
                  const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: issueNumber });
                  const inherited = issue.labels
                    .map(label => typeof label === 'string' ? label : label.name)
                    .find(name => ['type/bug', 'type/feature', 'type/task', 'type/epic'].includes(name));
                  if (inherited) {
                    type = inherited;
                    break;
                  }
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }
            type ||= 'type/task';

            const { data: current } = await github.rest.issues.listLabelsOnIssue({
              ...context.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            for (const label of current.map(x => x.name).filter(x => x.startsWith('type/'))) {
              if (label !== type) {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number: pr.number, name: label });
              }
            }
            await github.rest.issues.addLabels({ ...context.repo, issue_number: pr.number, labels: [type] });

      - name: Classify changed areas
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
