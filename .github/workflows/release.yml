name: release

# Builds the Ampersand-<ver>.dmg and publishes it to a GitHub Release.
# Tag pushes are the normal release path. workflow_dispatch is a recovery path
# for an existing immutable v* tag and never publishes arbitrary branch state.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  codeql-preflight:
    name: Release CodeQL preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    permissions:
      actions: write
      contents: read
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      release_mode: ${{ steps.release_state.outputs.mode }}
    steps:
      - name: Validate release tag input
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          }
          expected_ref="refs/tags/${RELEASE_TAG}"
          test "${GITHUB_REF}" = "${expected_ref}" || {
            echo "release/recovery must execute from exact tag ref ${expected_ref}; got ${GITHUB_REF}" >&2
            echo "for recovery use: gh workflow run release.yml --ref ${RELEASE_TAG} -f tag=${RELEASE_TAG}" >&2
            exit 1
          }

      - name: Resolve immutable release source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Release tag did not resolve to an immutable commit"; exit 1;
          }
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_commit}...${remote_main}")"
          jq -e --arg sha "$tag_commit" '
            (.status == "ahead" or .status == "identical")
            and .base_commit.sha == $sha
            and .merge_base_commit.sha == $sha
          ' <<<"$compare" >/dev/null || {
            echo "::error::Release tag source is not reviewed protected-main history"; exit 1;
          }
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Classify existing release recovery
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          set +e
          lookup="$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null | grep -m1 -E '^HTTP/')"
          set -e
          case "$lookup" in
            HTTP*\ 404*) echo "mode=new" >> "$GITHUB_OUTPUT" ;;
            HTTP*\ 200*) echo "mode=recovery" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Inconclusive release lookup: $lookup"; exit 1 ;;
          esac

      - name: Checkout trusted release verifier
        if: steps.release_state.outputs.mode == 'new'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted release verifier ancestry
        if: steps.release_state.outputs.mode == 'new'
        run: |
          set -euo pipefail
          verifier_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$verifier_sha" FETCH_HEAD

      # Existing *published* release asset recovery is a legacy operation,
      # not a first publication. Never treat an owner-created release as
      # evidence of a secured first publication.
      - name: Verify exact-tag CodeQL before first GitHub Release publication
        if: steps.release_state.outputs.mode == 'new'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          python3 scripts/release_codeql_gate.py \
            --repository "$GITHUB_REPOSITORY" \
            --candidate-sha "$RELEASE_COMMIT"

  dmg:
    name: Build and publish verified DMG
    needs: codeql-preflight
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Validate preflight source
        env:
          SOURCE_COMMIT: ${{ needs.codeql-preflight.outputs.source_commit }}
          RELEASE_MODE: ${{ needs.codeql-preflight.outputs.release_mode }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$RELEASE_MODE" == new || "$RELEASE_MODE" == recovery ]] || exit 1

      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checked-out tag identity
        env:
          SOURCE_COMMIT: ${{ needs.codeql-preflight.outputs.source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          head_commit="$(git rev-parse HEAD)"
          test "$head_commit" = "$tag_commit"
          test "$head_commit" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$head_commit" origin/main

      - name: Build DMG
        run: bash scripts/package-macos.sh dmg

      - name: Launch packaged app smoke
        run: bash scripts/smoke-packaged-app-launch.sh dist/Ampersand.app

      - name: Verify version, signature, and DMG integrity
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Ampersand.app/Contents/Info.plist)"
          test "v${VERSION}" = "${RELEASE_TAG}"

          DMG="dist/Ampersand-${VERSION}.dmg"
          test -s "${DMG}"
          codesign --verify --deep --strict dist/Ampersand.app
          hdiutil verify "${DMG}"

          CHECKSUM="dist/Ampersand-${VERSION}.sha256"
          (cd dist && shasum -a 256 "Ampersand-${VERSION}.dmg" > "Ampersand-${VERSION}.sha256")
          test -s "${CHECKSUM}"

          {
            echo "version=${VERSION}"
            echo "dmg=${DMG}"
            echo "checksum=${CHECKSUM}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest verified DMG build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.artifact.outputs.dmg }}

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ampersand-release-${{ steps.artifact.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.artifact.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.codeql-preflight.outputs.source_commit }}
          RELEASE_MODE: ${{ needs.codeql-preflight.outputs.release_mode }}
          VERSION: ${{ steps.artifact.outputs.version }}
          DMG: ${{ steps.artifact.outputs.dmg }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          # The tag must still resolve to the exact reviewed and scanned source
          # immediately before mutating managed GitHub Release assets.
          live_tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          [[ "$live_tag_commit" == "$SOURCE_COMMIT" ]] || {
            echo "::error::Release tag source moved after preflight"; exit 1;
          }
          set +e
          lookup="$(gh api --include \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null \
            | grep -m1 -E '^HTTP/')"
          set -e

          # Never turn an originally unverified "new" publication into a
          # recovery if the release state changed during this run.
          case "${RELEASE_MODE}:${lookup}" in
            recovery:HTTP*\ 200*)
              gh release upload "${RELEASE_TAG}" \
                "${DMG}" "${CHECKSUM}" \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber
              ;;
            new:HTTP*\ 404*)
              gh release create "${RELEASE_TAG}" \
                "${DMG}" "${CHECKSUM}" \
                --repo "${GITHUB_REPOSITORY}" \
                --verify-tag \
                --title "Ampersand ${VERSION}" \
                --notes "Ad-hoc signed DMG. See README 'Installation' for the first-launch right-click→Open step (no Developer ID)."
              ;;
            *)
              echo "::error::Release state changed or lookup inconclusive: ${RELEASE_MODE}:${lookup}" >&2
              exit 1
              ;;
          esac

      - name: Verify published release identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.codeql-preflight.outputs.source_commit }}
          VERSION: ${{ steps.artifact.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.tag_name' <<<"${release}")" = "${RELEASE_TAG}"

          published_commit="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          test "${published_commit}" = "${SOURCE_COMMIT}"

          assets="$(jq -r '.assets[].name' <<<"${release}")"
          grep -qx "Ampersand-${VERSION}.dmg" <<<"${assets}"
          grep -qx "Ampersand-${VERSION}.sha256" <<<"${assets}"
