name: release

# Builds the Ampersand-<ver>.dmg and publishes it to a GitHub Release.
# Tag pushes are the normal release path. workflow_dispatch is a recovery path
# for an existing immutable v* tag and never publishes arbitrary branch state.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to build or recover
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 30
    # Release mutation is the only write this workflow needs, and it is scoped
    # to the single job that performs it.
    permissions:
      contents: write
    steps:
      - name: Validate release tag input
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid release tag: ${RELEASE_TAG}" >&2
            exit 1
          }

      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          # The build must not have ambient push access to the repository.
          persist-credentials: false

      - name: Verify checked-out tag identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          head_commit="$(git rev-parse HEAD)"
          test "${head_commit}" = "${tag_commit}"
          test -z "$(git status --porcelain)"
          echo "commit=${head_commit}" >> "${GITHUB_OUTPUT}"

      - name: Build DMG
        run: bash scripts/package-macos.sh dmg

      - name: Verify version, signature, and DMG integrity
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/Ampersand.app/Contents/Info.plist)"
          test "v${VERSION}" = "${RELEASE_TAG}"

          DMG="dist/Ampersand-${VERSION}.dmg"
          test -s "${DMG}"
          codesign --verify --deep --strict dist/Ampersand.app
          hdiutil verify "${DMG}"

          CHECKSUM="dist/Ampersand-${VERSION}.sha256"
          (cd dist && shasum -a 256 "Ampersand-${VERSION}.dmg" > "Ampersand-${VERSION}.sha256")
          test -s "${CHECKSUM}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "dmg=${DMG}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${CHECKSUM}" >> "${GITHUB_OUTPUT}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ampersand-release-${{ steps.artifact.outputs.version }}
          path: |
            ${{ steps.artifact.outputs.dmg }}
            ${{ steps.artifact.outputs.checksum }}
          if-no-files-found: error
          retention-days: 7

      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.artifact.outputs.version }}
          DMG: ${{ steps.artifact.outputs.dmg }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail
          # Branch on the HTTP status line, not on substring-matching an error
          # message: "not found" also appears in auth/permission failures, and
          # treating those as "no release yet" is a fail-open path. Anything
          # that is neither 200 nor 404 - including a transport failure, which
          # produces no status line at all - aborts the release.
          set +e
          lookup="$(gh api --include \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null \
            | grep -m1 -E '^HTTP/')"
          set -e

          case "${lookup}" in
            HTTP*\ 200*)
              gh release upload "${RELEASE_TAG}" \
                "${DMG}" "${CHECKSUM}" \
                --repo "${GITHUB_REPOSITORY}" \
                --clobber
              ;;
            HTTP*\ 404*)
              gh release create "${RELEASE_TAG}" \
                "${DMG}" "${CHECKSUM}" \
                --repo "${GITHUB_REPOSITORY}" \
                --verify-tag \
                --title "Ampersand ${VERSION}" \
                --notes "Ad-hoc signed DMG. See README 'Installation' for the first-launch right-click→Open step (no Developer ID)."
              ;;
            *)
              echo "release lookup was inconclusive, refusing to publish: ${lookup}" >&2
              exit 1
              ;;
          esac

      - name: Verify published release identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          VERSION: ${{ steps.artifact.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          # Closes the tag -> source -> artifact -> release chain: the release
          # that now exists must carry this tag, the tag must still resolve to
          # the commit that was built, and both asset names must be present.
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          test "$(jq -r '.tag_name' <<<"${release}")" = "${RELEASE_TAG}"

          # Resolves lightweight and annotated tags alike, server-side.
          published_commit="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${RELEASE_TAG}" --jq '.sha')"
          test "${published_commit}" = "${SOURCE_COMMIT}"

          assets="$(jq -r '.assets[].name' <<<"${release}")"
          grep -qx "Ampersand-${VERSION}.dmg" <<<"${assets}"
          grep -qx "Ampersand-${VERSION}.sha256" <<<"${assets}"
